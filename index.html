<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Top-Trending Korean Skincare: Collagen & PDRN Balm Sticks</title>
  <style>
    /* CSS RESET & VARIABLES */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    :root {
      --amazon-navy: #131921;
      --amazon-light-navy: #232f3e;
      --amazon-yellow: #FFD814;
      --amazon-yellow-hover: #F7CA00;
      --amazon-amber: #FFA41C;
      --amazon-red: #CC0C39;
      --amazon-text: #0F1111;
      --amazon-link: #007185;
      --amazon-link-hover: #C7511F;
      --amazon-star: #DE7921;
      --amazon-green: #007600;
      --bg-gray: #EAEDED;
      --border-color: #D5D9D9;
      --font-family: Arial, Helvetica, sans-serif;
    }

    body {
      font-family: var(--font-family);
      color: var(--amazon-text);
      background-color: var(--bg-gray);
      line-height: 1.4;
      -webkit-font-smoothing: antialiased;
    }

    a {
      text-decoration: none;
      color: var(--amazon-link);
    }

    a:hover {
      color: var(--amazon-link-hover);
      text-decoration: underline;
    }

    /* TOP ANNOUNCEMENT BAR */
    .top-bar {
      background-color: var(--amazon-light-navy);
      color: #FFFFFF;
      text-align: center;
      padding: 6px 12px;
      font-size: 12px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    /* CENTERED NAVIGATION HEADER */
    .nav-header {
      background-color: var(--amazon-navy);
      padding: 14px 15px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      width: 100%;
    }

    .brand-logo {
      color: #FFFFFF;
      font-size: 22px;
      font-weight: bold;
      white-space: nowrap;
      text-align: center;
    }

    .brand-logo span {
      color: var(--amazon-amber);
    }

    /* HIGH-IMPACT ATTRACTIVE DEAL BANNER */
    .deal-banner-container {
      background: linear-gradient(135deg, #111111 0%, #8A0000 50%, #CC0C39 100%);
      color: #FFFFFF;
      padding: 18px 15px;
      box-shadow: 0 4px 20px rgba(204, 12, 57, 0.35);
      border-bottom: 3px solid #FFD814;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .deal-banner-content {
      max-width: 1100px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    @media (min-width: 768px) {
      .deal-banner-content {
        flex-direction: row;
        justify-content: space-between;
      }
    }

    .deal-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .deal-badge-flash {
      background: #FFD814;
      color: #111111;
      font-size: 12px;
      font-weight: 900;
      padding: 6px 12px;
      border-radius: 20px;
      text-transform: uppercase;
      letter-spacing: 1px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 10px rgba(255, 216, 20, 0.5);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #CC0C39;
      border-radius: 50%;
      display: inline-block;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(204, 12, 57, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(204, 12, 57, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(204, 12, 57, 0); }
    }

    .deal-main-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      line-height: 1.2;
    }

    @media (min-width: 768px) {
      .deal-main-title {
        font-size: 24px;
      }
    }

    .highlight-gold {
      color: #FFD814;
      text-shadow: 0 0 12px rgba(255, 216, 20, 0.4);
      background: linear-gradient(180deg, #FFF 0%, #FFD814 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .deal-right {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 0, 0, 0.35);
      padding: 6px 16px;
      border-radius: 30px;
      border: 1px solid rgba(255, 216, 20, 0.3);
    }

    .timer-label {
      font-size: 11px;
      text-transform: uppercase;
      color: #E0E0E0;
      letter-spacing: 0.5px;
      font-weight: 600;
    }

    .timer-clock {
      font-family: monospace, sans-serif;
      font-size: 16px;
      font-weight: bold;
      color: #FFD814;
      letter-spacing: 1px;
    }

    /* MAIN CONTAINER */
    .container {
      max-width: 1150px;
      margin: 0 auto;
      padding: 15px;
    }

    /* ORANGE & RED HERO SECTION STYLING */
    .hero {
      background: linear-gradient(135deg, #B12704 0%, #E65100 50%, #FF9900 100%) !important;
      border: 1px solid #B12704 !important;
      border-radius: 12px;
      padding: 26px 20px;
      margin-bottom: 20px;
      text-align: center;
      color: #FFFFFF !important;
      box-shadow: 0 4px 15px rgba(177, 39, 4, 0.25);
    }

    .hero h1 {
      color: #FFFFFF !important;
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    }

    .hero p {
      color: #FFF5EA !important;
      font-size: 15px;
      max-width: 750px;
      margin: 0 auto 18px auto;
      line-height: 1.5;
      font-weight: 500;
    }

    .trust-badges {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      font-weight: bold;
    }

    .trust-badge-item {
      background: rgba(255, 255, 255, 0.2) !important;
      color: #FFFFFF !important;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.4) !important;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      backdrop-filter: blur(4px);
    }

    /* PRODUCT GRID */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(1, 1fr);
      gap: 16px;
      margin-bottom: 24px;
    }

    @media (min-width: 768px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    /* PRODUCT CARD */
    .product-card {
      background-color: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .badge-popular {
      position: absolute;
      top: 12px;
      left: 12px;
      background-color: #C45500;
      color: #FFFFFF;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 2px;
      text-transform: uppercase;
      z-index: 10;
    }

    .image-container {
      width: 100%;
      height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
      overflow: hidden;
    }

      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
